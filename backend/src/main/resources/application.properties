# Application Configuration
spring.application.name=shopsphere-backend
server.port=${PORT:8080}

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:shopsphere_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Session Cookie Management
server.servlet.session.cookie.name=SHOPSPHERE_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=1d

# Admin Seed Defaults (Overridable via Environment)
shopsphere.seed.admin.email=${ADMIN_EMAIL:}
shopsphere.seed.admin.password=${ADMIN_PASSWORD:}
shopsphere.seed.admin.name=ShopSphere Administrator

# Customer Seed Defaults
shopsphere.seed.customer.email=${CUSTOMER_EMAIL:}
shopsphere.seed.customer.password=${CUSTOMER_PASSWORD:}
shopsphere.seed.customer.name=Demo Customer
